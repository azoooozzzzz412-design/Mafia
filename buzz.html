<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  :root{
    color-scheme: dark;
    --ink:#050507; --panel:#15131f; --text:#f5f3ff; --dim:#b9b3d1; --faint:#8b85a3;
    --gold:#7c5cff; --c:#8b85a3;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  [hidden]{ display:none !important; }
  html, body{ height:100%; }
  body{
    background:radial-gradient(ellipse 120% 55% at 50% -12%, rgba(124,92,255,.28), transparent 62%), var(--stars-a) 0 0/260px 260px, var(--ink); color:var(--text); font-family:var(--f-body);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    min-height:100%; min-height:100dvh; overflow:hidden;
    padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    touch-action: manipulation; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    transition: background-color .25s;
  }
  body.st-win{ background:var(--c); }
  body.st-lost{ background:#1d0c16; }
  body.st-armed{ background: radial-gradient(circle at 50% 50%, #4a1020 0%, var(--ink) 72%); }
  .msg, .btn, .team, .clock, .name-form input, .name-form button, .q-text, .q-txt{ font-family:var(--f-display); }

  .top{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .team{
    display:flex; align-items:center; gap:9px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:7px 16px 7px 12px;
    font-weight:700; font-size:1.02rem; max-width:70%;
  }
  .team .dot{ width:16px; height:16px; border-radius:5px; background:var(--c); flex-shrink:0; }
  .team span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button.team{ font-family:inherit; color:inherit; cursor:pointer; text-align:right; }
  .team .me{ color:var(--dim); font-weight:800; font-size:.88rem; }
  .team .me:empty{ display:none; }
  .team .edit{ font-size:.78rem; opacity:.75; flex-shrink:0; }
  .name-form{ display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:340px; }
  .name-form .big-emoji{ font-size:3.6rem; }
  .name-form input{
    width:100%; font-family:inherit; font-size:1.35rem; font-weight:800; text-align:center;
    padding:14px 16px; border-radius:14px; border:2px solid var(--c); background:rgba(255,255,255,.06);
    color:var(--text); outline:none; -webkit-user-select:text; user-select:text;
  }
  .name-form input::placeholder{ color:var(--faint); }
  .name-form button{
    width:100%; font-family:inherit; font-size:1.15rem; font-weight:900; padding:14px;
    border:1px solid rgba(255,255,255,.18); border-radius:999px; background:linear-gradient(180deg, #8a6dff, #6c4cff); color:#fff; cursor:pointer;
    box-shadow:0 12px 30px -10px rgba(124,92,255,.7);
  }
  .name-form.shake input{ animation: shake .35s; border-color:#e05a5a; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-8px); } 75%{ transform:translateX(8px); } }
  .conn{ display:flex; align-items:center; gap:6px; font-size:.75rem; font-weight:700; color:var(--dim); }
  .conn i{ width:9px; height:9px; border-radius:50%; background:#d9a53c; display:inline-block; }
  .conn.ok i{ background:#5fd18f; }
  .conn.bad i{ background:#e05a5a; }

  .center{ flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .btn{
    --size: min(76vw, 52vh, 380px);
    width:var(--size); height:var(--size); border-radius:50%; border:none; cursor:pointer;
    font-family:inherit; font-weight:900; font-size:calc(var(--size) * .17); color:#fff;
    background: radial-gradient(circle at 35% 30%, #4d4868, #1f1c2e 72%);
    box-shadow: 0 0 0 10px color-mix(in srgb, var(--c) 45%, transparent), 0 18px 40px rgba(0,0,0,.6), inset 0 -10px 24px rgba(0,0,0,.35);
    box-shadow: 0 0 0 10px var(--c), 0 18px 40px rgba(0,0,0,.6), inset 0 -10px 24px rgba(0,0,0,.35);
    position:relative; opacity:.55; transition: transform .08s, opacity .2s, background .2s;
    text-shadow:0 3px 10px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; line-height:1.1; text-align:center;
  }
  .btn[hidden]{ display:none; }
  body.st-armed .btn{
    opacity:1; background: radial-gradient(circle at 35% 28%, #ff7a6b, #e21b1b 55%, #9d0b0b);
  }
  /* نبض الزر وهو جاهز: حلقة تكبر وتختفي (أخف على الجوال من تحريك الظل) */
  .btn::after{ content:""; position:absolute; inset:-10px; border-radius:50%; border:12px solid rgba(255,60,60,.6); opacity:0; pointer-events:none; }
  body.st-armed .btn::after{ animation: ring 1s ease-out infinite; }
  @keyframes ring{ 0%{ transform:scale(1); opacity:.95; } 100%{ transform:scale(1.2); opacity:0; } }
  body.st-pressed .btn{ opacity:1; transform:scale(.93); background: radial-gradient(circle at 35% 30%, #b3342a, #7a0d0d 70%); }
  body.st-win .btn{ opacity:1; background: radial-gradient(circle at 35% 30%, #ffffff, #f7eedd 70%); color:var(--ink); text-shadow:none; animation: pop .5s ease; }
  body.st-lost .btn, body.st-excluded .btn{ opacity:.45; }
  .btn:active{ transform:scale(.95); }
  @keyframes pop{ 0%{ transform:scale(.8); } 60%{ transform:scale(1.06); } 100%{ transform:scale(1); } }

  .msg{ font-size:clamp(1.3rem, 6.4vw, 2rem); font-weight:900; text-align:center; line-height:1.35; min-height:1.4em; }
  .sub{ font-size:.92rem; color:var(--dim); text-align:center; line-height:1.7; max-width:34ch; }
  body.st-win .msg{ color:#fff; font-size:clamp(1.8rem, 9vw, 2.6rem); text-shadow:0 2px 14px rgba(0,0,0,.35); }
  body.st-win .sub, body.st-win .conn, body.st-win .foot{ color:rgba(255,255,255,.9); }
  body.st-win .team{ background:rgba(0,0,0,.18); border-color:rgba(255,255,255,.35); }
  body.st-win .team .me{ color:rgba(255,255,255,.85); }
  .big-emoji{ font-size:4.4rem; line-height:1; }
  .reload{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:var(--text);
    border-radius:12px; padding:10px 20px; font-family:inherit; font-weight:800; font-size:.9rem;
  }
  .reload[hidden]{ display:none; }
  /* ===== السؤال على الجوال ===== */
  .qcard{
    width:100%; max-width:520px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    border-radius:18px; padding:10px 14px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px;
    animation: qIn .25s ease;
  }
  @keyframes qIn{ from{ transform:translateY(-6px) scale(.98); } to{ transform:none; } }
  body.st-win .qcard{ background:rgba(0,0,0,.2); border-color:rgba(255,255,255,.35); }
  .q-meta{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .q-chip{ background:rgba(255,255,255,.1); border-radius:999px; padding:2px 12px; font-size:.8rem; font-weight:800; color:var(--dim); max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  body.st-win .q-chip{ color:rgba(255,255,255,.92); background:rgba(0,0,0,.18); }
  .q-pts{ background:var(--gold); color:#fff; border-radius:999px; padding:2px 11px; font-size:.8rem; font-weight:700; }
  .q-hex{ width:40px; height:46px; clip-path:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background:linear-gradient(135deg, #93c5fd, #3b82f6); color:#fff; font-size:1.45rem; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .q-text{ font-size:clamp(1.02rem, 4.8vw, 1.35rem); font-weight:800; line-height:1.65; color:var(--text); max-height:32vh; overflow:hidden; }
  .q-text.long{ font-size:clamp(.92rem, 4.1vw, 1.12rem); }
  body.st-win .q-text{ color:#fff; }
  .q-rebus{ display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; direction:rtl;
    background:linear-gradient(160deg, #f2f0fb, #e4e0f5); border-radius:16px; padding:10px; max-width:100%; }
  .q-img{ --s:min(24vw, 96px); width:var(--s); height:var(--s); display:block; flex:0 0 auto; object-fit:cover; border-radius:9px;
    border:2px solid #fff; box-shadow:0 3px 10px rgba(22,18,31,.35); background-color:#e4e0f5; background-repeat:no-repeat; }
  .q-rebus.m .q-img{ --s:min(21vw, 84px); }
  .q-rebus.s .q-img{ --s:min(17vw, 68px); }
  .q-txt{ font-weight:800; font-size:clamp(1.3rem, 6.5vw, 1.9rem); color:#16121f; line-height:1.2; }
  .q-rebus.s .q-txt{ font-size:clamp(1.05rem, 5vw, 1.45rem); }
  .q-plus{ font-weight:800; font-size:1.2rem; color:#6c5aa8; }
  .q-flag{ border-radius:6px; background-repeat:no-repeat; background-color:#fff; box-shadow:0 8px 22px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.2); }
  body.has-q .center{ justify-content:flex-start; gap:12px; padding-top:4px; min-height:0; }
  body.has-q .center::before{ content:""; margin-top:auto; }
  body.has-q .center::after{ content:""; margin-bottom:auto; }
  body.has-q .btn{ --size: min(42vw, 23vh, 210px); }
  body.has-q .msg{ font-size:clamp(1.15rem, 5.6vw, 1.6rem); }
  body.has-q.st-win .msg{ font-size:clamp(1.4rem, 7vw, 2rem); }
  /* ===== مؤقت الجواب ===== */
  .clock{ font-weight:900; font-size:clamp(1.5rem, 8vw, 2.4rem); line-height:1; direction:rtl; display:flex; align-items:center; gap:10px;
    background:rgba(0,0,0,.28); border:2px solid rgba(255,255,255,.25); border-radius:999px; padding:8px 20px; font-variant-numeric:tabular-nums; }
  .clock b{ font-family:ui-monospace, "SF Mono", Menlo, monospace; min-width:1.3em; text-align:center; direction:ltr; }
  .clock small{ font-size:.45em; font-weight:800; opacity:.85; }
  .clock.warn{ background:#fff; color:#c0271d; border-color:#fff; animation:tick .5s ease-in-out infinite alternate; }
  @keyframes tick{ from{ transform:scale(1); } to{ transform:scale(1.08); } }
  /* ===== الخصم (خلص الوقت أو جواب غلط) ===== */
  .pen{ display:flex; align-items:center; gap:10px; padding:6px 16px 6px 8px; border-radius:999px; max-width:100%;
    background:rgba(229,72,77,.16); border:1px solid rgba(255,120,120,.5); color:#ffd7d7; font-weight:800; font-size:1rem; }
  .pen b{ font-family:var(--f-display); direction:ltr; unicode-bidi:isolate; background:#e5484d; color:#fff; border-radius:999px; padding:2px 12px; font-size:1.25rem; line-height:1.3; }
  .pen.in{ animation: penIn .45s cubic-bezier(.2, 1.4, .4, 1); }
  .pen.plus{ background:rgba(34,197,94,.16); border-color:rgba(134,239,172,.55); color:#dcfce7; }
  .pen.plus b{ background:#16a34a; }
  @keyframes penIn{ from{ transform:scale(.6); opacity:0; } to{ transform:none; opacity:1; } }
  /* ===== طريق المليون على الجوال ===== */
  .mq{ width:100%; max-width:540px; display:flex; flex-direction:column; gap:10px; }
  .mq .q-chip b{ font-family:var(--f-mono); direction:ltr; unicode-bidi:isolate; }
  .mq .mq-card{ background:linear-gradient(180deg, rgba(250,204,21,.1), rgba(255,255,255,.04)); border:1px solid rgba(250,204,21,.3); border-radius:18px; padding:12px 14px; text-align:center; display:flex; flex-direction:column; gap:8px; }
  .mq .lv1{ color:#86efac; } .mq .lv2{ color:#fde68a; } .mq .lv3{ color:#fca5a5; }
  .mq-opts{ display:flex; flex-direction:column; gap:8px; }
  .mq-opt{ display:flex; align-items:center; gap:10px; width:100%; min-height:54px; padding:10px 12px; border-radius:16px; text-align:right;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.16); color:var(--text); font-family:var(--f-display); font-weight:700; font-size:1.02rem; line-height:1.4; }
  button.mq-opt{ cursor:pointer; }
  button.mq-opt:active{ transform:scale(.98); }
  .mq-opt .k{ flex:0 0 auto; width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:rgba(250,204,21,.16); color:#fef08a; font-weight:800; }
  .mq-opt.rm{ opacity:.15; } .mq-opt.rm .t{ visibility:hidden; }
  .mq-opt.sel{ border-color:#facc15; background:rgba(250,204,21,.22); box-shadow:0 0 22px -6px rgba(250,204,21,.7); }
  .mq-opt.sel .k{ background:#facc15; color:#1c1604; }
  .mq-opt.ok{ border-color:#22c55e; background:rgba(34,197,94,.3); } .mq-opt.ok .k{ background:#22c55e; color:#03140a; }
  .mq-opt.no{ border-color:#ef4444; background:rgba(239,68,68,.28); } .mq-opt.no .k{ background:#ef4444; color:#fff; }
  .mq-opt.dim{ opacity:.45; }
  .mq-opt .pc{ margin-inline-start:auto; font-family:var(--f-mono); font-size:.85rem; color:#fde68a; direction:ltr; }
  .mq-left{ display:inline-flex; align-items:center; gap:6px; align-self:center; padding:4px 14px; border-radius:999px; background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.2); font-weight:800; }
  .mq-left b{ font-family:ui-monospace, monospace; min-width:1.6em; text-align:center; direction:ltr; }
  .mq-left.warn{ background:#fff; color:#c0271d; }
  body.st-mq .center{ justify-content:flex-start; gap:12px; padding-top:4px; overflow-y:auto; }
  body.st-mq{ overflow-y:auto; }
  /* ===== اللي ضغط: الزر يختفي وتطلع بطاقة باسمه ===== */
  .who{ --w:#8b85a3; width:min(100%, 420px); display:flex; flex-direction:column; align-items:center; gap:6px; padding:18px 18px 16px; border-radius:24px; text-align:center;
    background:linear-gradient(180deg, color-mix(in srgb, var(--w) 30%, transparent), color-mix(in srgb, var(--w) 10%, transparent));
    border:2px solid color-mix(in srgb, var(--w) 75%, #fff); box-shadow:0 18px 44px -18px var(--w); animation:pop .4s ease; }
  .who-k{ font-size:.9rem; font-weight:800; color:rgba(255,255,255,.85); }
  .who-n{ font-family:var(--f-display); font-weight:900; font-size:clamp(2rem, 11vw, 3.2rem); line-height:1.15; color:#fff; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 3px 14px rgba(0,0,0,.35); }
  .who-t{ display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:1rem; padding:4px 14px; border-radius:999px; background:rgba(0,0,0,.25); }
  .who-t i{ width:12px; height:12px; border-radius:4px; background:var(--w); }
  body.has-q .who{ padding:12px 14px; gap:4px; }
  body.has-q .who-n{ font-size:clamp(1.6rem, 8vw, 2.3rem); }
  body.st-win .who{ background:rgba(0,0,0,.2); border-color:rgba(255,255,255,.7); }
  .clock.win2{ background:color-mix(in srgb, var(--c) 30%, transparent); border-color:var(--c); }
  .foot{ font-size:.72rem; color:var(--faint); text-align:center; }
  .foot b{ font-family:ui-monospace, monospace; direction:ltr; unicode-bidi:isolate; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div class="top">
    <button class="team" id="team" type="button" data-nopress aria-label="تغيير الاسم"><i class="dot"></i><span id="teamName">فريقك</span><span class="me" id="meName"></span><span class="edit" id="editIcon" hidden>✏️</span></button>
    <div class="conn" id="conn"><i></i><span id="connText">جاري الاتصال…</span></div>
  </div>

  <div class="center">
    <div class="big-emoji" id="bigEmoji" hidden></div>
    <form class="name-form" id="nameForm" data-nopress hidden>
      <div class="big-emoji">👋</div>
      <p class="msg">وش اسمك؟</p>
      <p class="sub">يطلع اسمك على الشاشة إذا ضغطت أول</p>
      <input id="nameInput" type="text" maxlength="16" autocomplete="nickname" autocapitalize="words" enterkeyhint="go" placeholder="اكتب اسمك">
      <button type="submit">يلا 👍</button>
    </form>
    <div class="qcard" id="qcard" hidden></div>
    <div class="mq" id="mq" data-nopress hidden></div>
    <div class="who" id="who" hidden><span class="who-k" id="whoK">⚡ ضغط أول</span><b class="who-n" id="whoN"></b><span class="who-t"><i></i><span id="whoT"></span></span></div>
    <button class="btn" id="btn" type="button" aria-label="زر الضغط">…</button>
    <div class="clock" id="clock" hidden aria-live="off"><span>⏱️</span><b id="clockN">0</b><small id="clockW">ثانية</small></div>
    <div class="pen" id="pen" hidden role="status"><b id="penN"></b><span id="penT"></span></div>
    <p class="msg" id="msg">جاري الاتصال…</p>
    <p class="sub" id="sub"></p>
    <button class="reload" id="reload" type="button" data-nopress hidden>🔄 تحديث الصفحة</button>
  </div>

  <p class="foot" id="foot">طاولة السهرة · أسرع إصبع</p>

<script>
/* v7: المكتبة تتحمّل بدون ما توقف رسم الصفحة — السكربت يشتغل أول ما تجهز */
document.addEventListener("DOMContentLoaded", function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var room = (qs.get("r") || "").trim().toLowerCase();
  var teamId = (qs.get("t") || "").trim();
  var $ = function(id){ return document.getElementById(id); };
  var els = { team:$("team"), teamName:$("teamName"), conn:$("conn"), connText:$("connText"),
              btn:$("btn"), msg:$("msg"), sub:$("sub"), reload:$("reload"), big:$("bigEmoji"), foot:$("foot"),
              meName:$("meName"), editIcon:$("editIcon"), nameForm:$("nameForm"), nameInput:$("nameInput"),
              qcard:$("qcard"), clock:$("clock"), clockN:$("clockN"), clockW:$("clockW"),
              pen:$("pen"), penN:$("penN"), penT:$("penT"), mq:$("mq"),
              who:$("who"), whoK:$("whoK"), whoN:$("whoN"), whoT:$("whoT") };

  var pid;
  try{
    pid = localStorage.getItem("sahra-buzz-pid");
    if(!pid){ pid = "p" + Math.random().toString(36).slice(2, 10); localStorage.setItem("sahra-buzz-pid", pid); }
  }catch(e){ pid = "p" + Math.random().toString(36).slice(2, 10); }

  /* اسم اللاعب — ينحفظ بالجوال عشان ما يكتبه كل مرة */
  var NAME_KEY = "sahra-buzz-name";
  function cleanName(n){ return String(n || "").replace(/\s+/g, " ").trim().slice(0, 16); }
  var myName = "";
  try{ myName = cleanName(localStorage.getItem(NAME_KEY)); }catch(e){}
  var editing = !myName;

  /* الحالة: الشاشة (المضيف) هي الحَكَم — هنا بس نعرض اللي توصلنا منها ونرسل الضغطة */
  var S = { conn:"connecting", connSince:Date.now(), host:null, lastSeen:0,
            pressedQid:null, pressedAt:0, celebrated:null, wakeLock:null, audio:null,
            endAt:0, clockT:null, toutKey:null, penKey:null, addKey:null, penT:null,
            mqSent:null, mqEnd:0, mqT:null, mqLastQ:null, mqHtml:null, wEnd:0, wKey:null };
  var client = null, ch = null;

  els.reload.addEventListener("click", function(){ location.reload(); });

  function fatal(emoji, msg, sub){
    els.btn.hidden = true;
    els.big.hidden = false; els.big.textContent = emoji;
    els.msg.textContent = msg; els.sub.textContent = sub || "";
    els.conn.hidden = true; els.team.hidden = true;
  }
  if(!/^[a-z0-9]{4,16}$/.test(room) || !teamId){
    fatal("📷", "امسح الباركود من الشاشة", "افتح «📱 أسرع إصبع» من طاولة السهرة، وصوّب كاميرا جوالك على باركود فريقك.");
    return;
  }
  if(typeof window.supabase === "undefined" || !window.supabase.createClient){
    fatal("⚠️", "ما قدرنا نحمّل الصفحة", "تأكد من الإنترنت واضغط تحديث.");
    els.reload.hidden = false;

    els.big.hidden = !big; els.big.textContent = big;
    els.btn.textContent = btn; els.msg.textContent = msg; els.sub.textContent = sub;
    els.sub.hidden = els.sub.hidden || !sub;
  }

  /* ===== «طريق المليون» على الجوال: يشوف السؤال، ويختار الجواب (الكل يجاوب) أو يصوّت (اسأل الجمهور) ===== */
  var MQ_KEYS = ["أ", "ب", "ج", "د"], MQ_LV = { 1:"سهل", 2:"متوسط", 3:"صعب" };
  function mqMine(m){
    if(!m) return null;
    if(m.mode === "all"){ var r = m.reveal && m.reveal.picks; if(r && typeof r[teamId] === "number") return r[teamId]; return S.mqSent && S.mqSent.qid === m.qid ? S.mqSent.c : null; }
    if(m.seat === teamId) return typeof m.sel === "number" ? m.sel : null;
    return null;
  }
  function mqCanAct(m){
    if(!m || !m.qid) return false;
    if(m.phase === "pick") return m.mode === "all" && (m.picked || []).indexOf(teamId) === -1 && !(S.mqSent && S.mqSent.qid === m.qid);
    if(m.phase === "vote") return m.mode === "seat" && m.seat !== teamId;
    return false;
  }
  function mqTexts(m){
    var seatT = m && m.seat ? teamById(m.seat) : null, seatName = seatT ? seatT.name : (m && m.seatName) || "";
    if(!m || m.phase === "wait"){
      if(m && m.mode === "seat" && seatName) return { msg: m.seat === teamId ? "دوركم على الكرسي! 🪑" : "دور " + seatName + " على الكرسي", sub: m.seat === teamId ? "المقدّم بيبدأ أول سؤال." : "تفرّجوا — وممكن نحتاجكم بـ«اسأل الجمهور»." };
      return { msg: "استعدوا 💰", sub: "السؤال الجاي بيطلع هنا." };
    }
    var mine = mqMine(m);
    if(m.phase === "pick"){
      if(S.mqSent && S.mqSent.qid === m.qid) return { msg: "✅ اخترتوا «" + MQ_KEYS[S.mqSent.c] + "»", sub: "ننتظر الباقين…" };
      if((m.picked || []).indexOf(teamId) !== -1) return { msg: "✅ فريقكم جاوب", sub: "ننتظر الباقين…" };
      return { msg: "اختاروا الجواب!", sub: "أول اختيار من فريقكم هو اللي ينحسب." };
    }
    if(m.phase === "lock") return { msg: mine != null ? "انقفلت الأجوبة — اخترتوا «" + MQ_KEYS[mine] + "»" : "انقفلت الأجوبة", sub: "ننتظر المقدّم يكشف الجواب." };
    if(m.phase === "vote"){
      if(m.seat === teamId) return { msg: "الجمهور يصوّت لكم…", sub: "انتظروا النتيجة على الشاشة." };
      return { msg: "🗳️ اسأل الجمهور!", sub: S.mqVote && S.mqVote.qid === m.qid ? "صوتك: «" + MQ_KEYS[S.mqVote.c] + "» — تقدر تغيّره قبل ما يخلص الوقت." : "ساعدوا " + seatName + ": وش الجواب برأيك؟" };
    }
    if(m.phase === "reveal" && m.reveal){
      var c = m.reveal.c;
      if(m.mode === "all"){
        var g = m.reveal.gain && m.reveal.gain[teamId];
        if(mine == null) return { msg: "الجواب الصح «" + MQ_KEYS[c] + "»", sub: "ما جاوبتوا هالمرة." };
        return mine === c ? { msg: "✅ صح! +" + (g || 0), sub: m.reveal.fast === teamId ? "⚡ كنتوا أسرع فريق!" : "كفو عليكم." } : { msg: "❌ غلط", sub: "الجواب الصح «" + MQ_KEYS[c] + "»." };
      }
      if(m.seat === teamId) return m.reveal.chosen === c ? { msg: "✅ صح!", sub: "كمّلوا الطريق للمليون." } : { msg: "❌ غلط", sub: "الجواب الصح «" + MQ_KEYS[c] + "»." };
      return { msg: "الجواب الصح «" + MQ_KEYS[c] + "»", sub: seatName ? (m.reveal.chosen === c ? seatName + " جاوبوا صح." : seatName + " غلطوا.") : "" };
    }
    if(m.seat === teamId) return { msg: "دوركم! قولوا جوابكم للمقدّم", sub: typeof m.sel === "number" ? "اخترتوا «" + MQ_KEYS[m.sel] + "» — ننتظر التأكيد." : "السؤال على " + (m.amt || "") + "." };
    return { msg: "دور " + seatName + " على الكرسي", sub: typeof m.sel === "number" ? "اختاروا «" + MQ_KEYS[m.sel] + "»… صح ولا غلط؟" : "تفرّجوا وخلّكم جاهزين." };
  }
  function renderMq(v){
    if(v !== "mq"){ if(!els.mq.hidden){ els.mq.hidden = true; els.mq.innerHTML = ""; S.mqHtml = null; } return; }
    var m = S.host.mq, html = "";
    if(m.phase !== "wait" && Array.isArray(m.opts)){
      var act = mqCanAct(m), mine = mqMine(m), vote = S.mqVote && S.mqVote.qid === m.qid ? S.mqVote.c : null;
      var counts = m.aud && Array.isArray(m.aud.counts) ? m.aud.counts : null;
      html = '<div class="mq-card"><div class="q-meta"><span class="q-chip">💰 سؤال <b>' + (num(m.n, 1, 99) | 0) + '</b> من <b>' + (num(m.total, 1, 99) | 0) + '</b></span>'
        + (MQ_LV[m.lv] ? '<span class="q-chip lv' + (m.lv | 0) + '">' + MQ_LV[m.lv] + '</span>' : '')
        + (m.mode === "all" && m.pts ? '<span class="q-pts">' + ptsText(num(m.pts, 0, 99) | 0) + '</span>' : '') + '</div>'
        + '<p class="q-text' + (String(m.text || "").length > 110 ? " long" : "") + '">' + esc(String(m.text || "").slice(0, 300)) + '</p></div>'
        + (S.mqEnd ? '<div class="mq-left" id="mqLeft">⏱️ <b></b></div>' : '')   /* الرقم يتحدّث بـ mqTick — عشان الأزرار ما تنعاد رسمتها كل ثانية وتضيع الضغطة */
        + '<div class="mq-opts">' + m.opts.slice(0, 4).map(function(o, k){
          if(o == null) return '<div class="mq-opt rm"><span class="k">' + MQ_KEYS[k] + '</span><span class="t">—</span></div>';
          var cls = "";
          if(m.phase === "reveal" && m.reveal){ cls = k === m.reveal.c ? "ok" : (k === mine || (m.mode === "seat" && k === m.reveal.chosen) ? "no" : "dim"); }
          else if(k === mine || k === vote) cls = "sel";
          var tag = act ? "button" : "div";
          return '<' + tag + (act ? ' type="button" data-mqk="' + k + '"' : '') + ' class="mq-opt' + (cls ? " " + cls : "") + '"><span class="k">' + MQ_KEYS[k] + '</span><span class="t">' + esc(String(o).slice(0, 80)) + '</span>'
            + (counts && typeof counts[k] === "number" ? '<span class="pc">' + (counts[k] | 0) + '%</span>' : '') + '</' + tag + '>';
        }).join("") + '</div>';
    }
    if(html !== S.mqHtml){ S.mqHtml = html; els.mq.innerHTML = html; }
    els.mq.hidden = !html;
    if(html) mqTick();
  }
  function mqLeftN(){ return S.mqEnd ? Math.max(0, Math.ceil((S.mqEnd - Date.now()) / 1000)) : 0; }
  function mqTick(){
    var el = document.getElementById("mqLeft"), n = mqLeftN();
    if(el){ var b = el.querySelector("b"); if(b) b.textContent = n; el.classList.toggle("warn", n <= 5); }
    if(n <= 0){ clearInterval(S.mqT); S.mqT = null; }
  }
  els.mq.addEventListener("click", function(e){
    var b = e.target.closest("[data-mqk]"); if(!b || !S.host || !S.host.mq) return;
    var m = S.host.mq, c = +b.getAttribute("data-mqk");
    unlockAudio(); keepAwake();
    if(!mqCanAct(m)) return;
    if(m.phase === "pick"){
      if(!send("mpick", { team:teamId, pid:pid, name:myName, qid:m.qid, c:c })) return;
      S.mqSent = { qid:m.qid, c:c };
    } else if(m.phase === "vote"){
      if(!send("mvote", { team:teamId, pid:pid, qid:m.qid, c:c })) return;
      S.mqVote = { qid:m.qid, c:c };
    }
    vibrate(30); clickSound();
    S.mqHtml = null; render();
  });

  /* الضغط: أي مكان بالشاشة (الشاشة كلها زر) */
  function press(e){
    if(e && e.target && e.target.closest && e.target.closest("[data-nopress]")) return;
    if(editing) return;
    if(e && e.cancelable) e.preventDefault();
    unlockAudio(); keepAwake();
    if(view() !== "armed") return;
    if(!send("buzz", { team:teamId, qid:S.host.qid, pid:pid, name:myName })) return;
    S.pressedQid = S.host.qid; S.pressedAt = Date.now();
    vibrate(40); clickSound();
    render();
  }
  document.addEventListener("pointerdown", press, { passive:false });
  document.addEventListener("keydown", function(e){ if(e.key === " " || e.key === "Enter"){ press(e); } });
  document.addEventListener("contextmenu", function(e){ if(!(e.target && e.target.closest && e.target.closest("input"))) e.preventDefault(); });

  /* أصوات واهتزاز */
  function vibrate(p){
    try{
      if(navigator.userActivation && !navigator.userActivation.hasBeenActive) return;   /* المتصفح يمنع الاهتزاز قبل أول لمسة */
      if(navigator.vibrate) navigator.vibrate(p);
    }catch(e){}
  }
  function unlockAudio(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      if(!S.audio) S.audio = new Ctx();
      if(S.audio.state === "suspended") S.audio.resume();
    }catch(e){}
  }
  function tone(freqs, dur, vol){
    try{
      if(!S.audio) return;
      var a = S.audio, t0 = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = "triangle";
      freqs.forEach(function(f, i){ o.frequency.setValueAtTime(f, t0 + i * dur / freqs.length); });
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    }catch(e){}
  }
  function clickSound(){ tone([620], 0.09, 0.25); }
  function winSound(){ tone([660, 880, 1320], 0.5, 0.3); }
  function timeUpSound(){ tone([440, 330, 220], 0.6, 0.28); }

  /* الشاشة ما تطفي وقت اللعب */
  function keepAwake(){
    try{
      if(!("wakeLock" in navigator) || S.wakeLock || document.visibilityState !== "visible") return;
      navigator.wakeLock.request("screen").then(function(l){
        S.wakeLock = l;
        l.addEventListener("release", function(){ S.wakeLock = null; });
      }).catch(function(){});
    }catch(e){}
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState !== "visible") return;
    keepAwake();
    /* رجعنا للصفحة بعد ما طفت الشاشة — الاتصال غالبًا انقطع */
    if(S.conn !== "on") reconnect(); else hello();
    render();
  });

  /* مراقبة: نحدّث العرض كل ثانية، ونعيد الاتصال لو طوّل الانقطاع */
  setInterval(function(){
    var now = Date.now();
    if(S.conn === "error" && now - S.connSince > 10000){ reconnect(); }
    else if(S.conn === "connecting" && now - S.connSince > 20000){ reconnect(); }
    else if(S.conn === "on" && S.host && now - S.lastSeen > 14000 && (Math.floor(now / 1000) % 5 === 0)){ hello(); }
    render();
  }, 1000);

  connect();
  render();
});
</script>
</body>
